name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: versioned facts
        run: python3 docs/check-facts.py
      - name: fact-check tests
        run: python3 -m unittest discover -s tests
      - name: index.html manifest is current
        run: |
          python3 docs/gen-manifest.py
          git diff --exit-code index.html || (echo "::error::index.html manifest is stale, run python3 docs/gen-manifest.py" && exit 1)
